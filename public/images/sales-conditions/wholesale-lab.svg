<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="wh-bg" x1="400" y1="0" x2="400" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f0f0f"/>
      <stop offset="0.55" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="wh-gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F9BD65"/>
      <stop offset="0.5" stop-color="#E6A816"/>
      <stop offset="1" stop-color="#C48B0A"/>
    </linearGradient>
    <linearGradient id="wh-oil" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5D78E" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#E6A816"/>
      <stop offset="1" stop-color="#8B5A12" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="wh-can" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop stop-color="#4A6FA5"/>
      <stop offset="0.35" stop-color="#2E4A72"/>
      <stop offset="1" stop-color="#1A2D45"/>
    </linearGradient>
    <linearGradient id="wh-can-shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wh-paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <filter id="wh-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wh-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="wh-spot" cx="0.5" cy="0.45" r="0.55">
      <stop stop-color="#E6A816" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E6A816" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#wh-bg)"/>
  <rect width="800" height="600" fill="url(#wh-spot)"/>
  <ellipse cx="400" cy="560" rx="360" ry="45" fill="#000" opacity="0.35"/>

  <!-- Oil splash backdrop -->
  <g opacity="0.85" filter="url(#wh-glow)">
    <path d="M520 80 C620 40 720 120 680 220 C640 320 560 280 500 200 C440 120 420 100 520 80Z" fill="url(#wh-oil)" opacity="0.35"/>
    <path d="M480 140 C560 100 640 180 600 280 C560 380 480 340 440 260 C400 180 400 160 480 140Z" fill="url(#wh-oil)" opacity="0.5"/>
    <path d="M540 200 C600 170 660 230 630 310 C600 390 520 360 490 290 C460 220 500 210 540 200Z" fill="#F9BD65" opacity="0.2"/>
  </g>

  <!-- Laboratory report -->
  <g filter="url(#wh-shadow)">
    <rect x="72" y="72" width="300" height="400" rx="14" fill="url(#wh-paper)" stroke="url(#wh-gold)" stroke-width="2"/>
    <rect x="72" y="72" width="300" height="48" rx="14" fill="#E6A816" opacity="0.12"/>
    <rect x="100" y="92" width="120" height="8" rx="4" fill="url(#wh-gold)"/>
    <text x="100" y="88" fill="#E6A816" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">LAB REPORT</text>
    <text x="100" y="145" fill="#888" font-family="Arial,Helvetica,sans-serif" font-size="9">VALIDATED RESULTS</text>

    <!-- Chart bars -->
    <rect x="100" y="170" width="240" height="100" rx="8" fill="#1e1e1e" stroke="#444" stroke-width="1"/>
    <rect x="118" y="228" width="28" height="32" rx="4" fill="#E6A816" opacity="0.85"/>
    <rect x="156" y="210" width="28" height="50" rx="4" fill="#F9BD65" opacity="0.75"/>
    <rect x="194" y="195" width="28" height="65" rx="4" fill="url(#wh-gold)"/>
    <rect x="232" y="218" width="28" height="42" rx="4" fill="#E6A816" opacity="0.55"/>
    <rect x="270" y="205" width="28" height="55" rx="4" fill="#F9BD65" opacity="0.65"/>
    <line x1="110" y1="200" x2="310" y2="200" stroke="#444" stroke-width="1"/>
    <text x="118" y="268" fill="#666" font-family="Arial,sans-serif" font-size="8">TAN</text>
    <text x="194" y="268" fill="#666" font-family="Arial,sans-serif" font-size="8">TBN</text>
    <text x="270" y="268" fill="#666" font-family="Arial,sans-serif" font-size="8">WEAR</text>

    <!-- Spec rows -->
    <circle cx="108" cy="300" r="4" fill="#E6A816"/>
    <rect x="122" y="296" width="200" height="5" rx="2.5" fill="#555"/>
    <circle cx="108" cy="322" r="4" fill="#E6A816"/>
    <rect x="122" y="318" width="175" height="5" rx="2.5" fill="#484848"/>
    <circle cx="108" cy="344" r="4" fill="#E6A816"/>
    <rect x="122" y="340" width="190" height="5" rx="2.5" fill="#484848"/>
    <circle cx="108" cy="366" r="4" fill="#E6A816"/>
    <rect x="122" y="362" width="160" height="5" rx="2.5" fill="#484848"/>

    <rect x="100" y="395" width="110" height="28" rx="6" fill="#E6A816" opacity="0.2" stroke="#E6A816" stroke-width="1"/>
    <text x="155" y="414" text-anchor="middle" fill="#F9BD65" font-family="Arial,sans-serif" font-size="10" font-weight="700">ISO CERTIFIED</text>
  </g>

  <!-- Romela oil cans -->
  <g filter="url(#wh-shadow)">
    <!-- Can 1 (back) -->
    <g transform="translate(430 200)">
      <rect x="0" y="40" width="88" height="200" rx="10" fill="url(#wh-can)"/>
      <rect x="0" y="40" width="88" height="200" rx="10" fill="url(#wh-can-shine)"/>
      <rect x="8" y="48" width="72" height="36" rx="4" fill="#E6A816" opacity="0.9"/>
      <text x="44" y="72" text-anchor="middle" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="14" font-weight="800">R</text>
      <text x="44" y="110" text-anchor="middle" fill="#F9BD65" font-family="Arial,sans-serif" font-size="9" font-weight="700">ATF-ZF</text>
      <ellipse cx="44" cy="38" rx="44" ry="10" fill="#3D5A8A"/>
      <rect x="4" y="230" width="80" height="14" rx="3" fill="#1A2D45"/>
    </g>
    <!-- Can 2 (center, tall) -->
    <g transform="translate(520 150)">
      <rect x="0" y="30" width="100" height="260" rx="12" fill="url(#wh-can)"/>
      <rect x="0" y="30" width="100" height="260" rx="12" fill="url(#wh-can-shine)"/>
      <rect x="10" y="40" width="80" height="44" rx="5" fill="url(#wh-gold)"/>
      <text x="50" y="70" text-anchor="middle" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="16" font-weight="800">ROMELA</text>
      <text x="50" y="130" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">ATF-XL</text>
      <text x="50" y="148" text-anchor="middle" fill="#F9BD65" font-family="Arial,sans-serif" font-size="8" opacity="0.8">HC-SYNTHESE</text>
      <ellipse cx="50" cy="28" rx="50" ry="12" fill="#4A6FA5"/>
      <rect x="6" y="280" width="88" height="16" rx="4" fill="#152238"/>
      <text x="50" y="292" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="7">4L</text>
    </g>
    <!-- Can 3 (front right) -->
    <g transform="translate(640 220)">
      <rect x="0" y="35" width="82" height="185" rx="10" fill="url(#wh-can)"/>
      <rect x="0" y="35" width="82" height="185" rx="10" fill="url(#wh-can-shine)"/>
      <rect x="8" y="44" width="66" height="32" rx="4" fill="#E6A816" opacity="0.85"/>
      <text x="41" y="66" text-anchor="middle" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="12" font-weight="800">R</text>
      <text x="41" y="105" text-anchor="middle" fill="#F9BD65" font-family="Arial,sans-serif" font-size="9" font-weight="700">ATF-VM</text>
      <ellipse cx="41" cy="33" rx="41" ry="9" fill="#3D5A8A"/>
    </g>
  </g>

  <!-- Wholesale badge -->
  <g filter="url(#wh-shadow)">
    <rect x="580" y="88" width="148" height="88" rx="12" fill="#2a2a2a" stroke="url(#wh-gold)" stroke-width="1.5"/>
    <rect x="596" y="104" width="48" height="48" rx="10" fill="#E6A816" opacity="0.15"/>
    <path d="M612 128 L628 112 L644 128 L636 128 L636 148 L620 148 L620 128 Z" fill="url(#wh-gold)"/>
    <path d="M652 118 L672 118 L672 138 L662 138 L662 128 L652 128 Z" fill="#E6A816" opacity="0.6"/>
    <path d="M652 142 L692 142 L692 152 L652 152 Z" fill="#E6A816" opacity="0.4"/>
    <text x="668" y="132" fill="#F9BD65" font-family="Arial,sans-serif" font-size="13" font-weight="800">B2B</text>
    <text x="668" y="158" fill="#999" font-family="Arial,sans-serif" font-size="9" letter-spacing="0.06em">WHOLESALE</text>
  </g>

  <!-- Bulk drums hint -->
  <g opacity="0.9">
    <ellipse cx="200" cy="510" rx="55" ry="14" fill="#1a1a1a"/>
    <rect x="145" y="430" width="110" height="85" rx="8" fill="#2d2d2d" stroke="#4A6FA5" stroke-width="1.5"/>
    <ellipse cx="200" cy="430" rx="55" ry="14" fill="#3D5A8A"/>
    <rect x="155" y="455" width="90" height="8" rx="2" fill="#E6A816" opacity="0.4"/>
    <rect x="155" y="475" width="90" height="8" rx="2" fill="#E6A816" opacity="0.25"/>
    <text x="200" y="500" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="8" font-weight="600">BULK SUPPLY</text>
  </g>

  <!-- Decorative particles -->
  <circle cx="380" cy="120" r="3" fill="#F9BD65" opacity="0.5"/>
  <circle cx="720" cy="380" r="2" fill="#E6A816" opacity="0.4"/>
  <circle cx="90" cy="480" r="2.5" fill="#E6A816" opacity="0.35"/>
</svg>
